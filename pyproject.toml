[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "financeproject"
version = "0.4.1"
description = "Household finance: a double-entry ledger with net worth in four units (TRY, real TRY, USD, grams of gold), Turkish central bank and CPI data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=3",
    "python-calamine>=0.2",
    "pypdf>=4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6", "matplotlib>=3.8"]

[project.scripts]
finance = "financeproject.cli:main"

[tool.setuptools.packages.find]
include = ["financeproject*"]

[tool.setuptools.package-data]
financeproject = ["data/*.csv"]
"financeproject.web" = ["templates/*.html", "static/**/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
