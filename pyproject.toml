[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "financeproject"
version = "0.1.0"
description = "Household finance: a double-entry ledger with net worth in four units (TRY, real TRY, USD, grams of gold), Turkish central bank and CPI data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=3",
    "python-calamine>=0.2",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8", "hypothesis>=6", "matplotlib>=3.8"]

[project.scripts]
finance = "financeproject.cli:main"

[tool.setuptools.packages.find]
include = ["financeproject*"]

[tool.setuptools.package-data]
financeproject = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
